version: "3.9"

services:
  backend:
    image: platform-backend:latest
    build:
      context: ./backend
    ports:
      - "8000:8000"
  device:
    image: platform-device:latest
    build:
      context: ./device-sim
    depends_on:
      - backend
  ota-server:
    image: platform-ota:latest
    build:
      context: ./ota-server
    ports:
      - "8081:8081"
