version: "3.9"

services:
  backend:
    image: platform-backend:latest
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - otel-collector
  device:
    image: platform-device:latest
    build:
      context: ./device-sim
    depends_on:
      - backend
    volumes:
      - ./keys:/keys:ro
  ota-server:
    image: platform-ota:latest
    build:
      context: ./ota-server
    ports:
      - "8081:8081"
    volumes:
      - ./keys:/keys:ro
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # OTLP ingest
